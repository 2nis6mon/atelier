<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBF6EE"/>
      <stop offset="1" stop-color="#EEDFCB"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FCE2D0"/>
      <stop offset="1" stop-color="#F3C2A4"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFEFB"/>
      <stop offset="1" stop-color="#FBF5EC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5C3A21" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#A84F36" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824×824 body centred in a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="3"/>
  <!-- the CV sheet -->
  <g filter="url(#shadow)">
    <path d="M300 220 h330 l94 94 v478 a28 28 0 0 1 -28 28 h-396 a28 28 0 0 1 -28 -28 v-544 a28 28 0 0 1 28 -28 z" fill="url(#sheet)"/>
  </g>
  <path d="M630 220 v66 a28 28 0 0 0 28 28 h66 z" fill="#EADBC7"/>
  <!-- name and headline -->
  <rect x="330" y="300" width="230" height="30" rx="8" fill="#202B3B"/>
  <rect x="330" y="348" width="150" height="18" rx="6" fill="#A84F36"/>
  <!-- section rules and text lines -->
  <rect x="330" y="410" width="364" height="6" rx="3" fill="#202B3B" opacity="0.18"/>
  <rect x="330" y="440" width="300" height="14" rx="7" fill="#5E6776" opacity="0.55"/>
  <rect x="330" y="472" width="340" height="14" rx="7" fill="#5E6776" opacity="0.55"/>
  <rect x="330" y="530" width="364" height="6" rx="3" fill="#202B3B" opacity="0.18"/>
  <rect x="330" y="560" width="250" height="14" rx="7" fill="#5E6776" opacity="0.55"/>
  <!-- the liquid lens selecting a line -->
  <g filter="url(#soft)">
    <rect x="286" y="600" width="452" height="72" rx="36" fill="url(#lens)"/>
  </g>
  <rect x="290" y="603" width="444" height="30" rx="15" fill="#FFFFFF" opacity="0.35"/>
  <rect x="330" y="629" width="290" height="14" rx="7" fill="#8E3F2B"/>
  <rect x="330" y="712" width="320" height="14" rx="7" fill="#5E6776" opacity="0.55"/>
  <rect x="330" y="744" width="220" height="14" rx="7" fill="#5E6776" opacity="0.55"/>
</svg>
